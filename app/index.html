<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZonaAzul</title>
    <script>
      // Fija el tema antes de que monte React para evitar el destello del tema
      // equivocado. Oscuro por defecto; la elección guardada gana.
      (function () {
        var tema = null
        try { tema = localStorage.getItem('zonaazul-tema') } catch (e) {}
        if (tema !== 'light') tema = 'dark'
        document.documentElement.setAttribute('data-theme', tema)
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&family=Saira+Stencil+One&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
